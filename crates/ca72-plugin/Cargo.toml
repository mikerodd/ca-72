[package]
name = "ca72-plugin"
description = "The CA-72 as a VST3 and CLAP plug-in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# A debug build that aborts when the audio thread allocates, for trying the plug-in in a
# host (nih-plug's own global allocator: the tests count with theirs instead).
assert_process_allocs = ["nih_plug/assert_process_allocs"]
# The plug-in as an application of its own (nih-plug's standalone host), for trying the
# editor without a host: `cargo run -p ca72-plugin --example standalone --features standalone`.
standalone = ["nih_plug/standalone"]
standalone-production = ["nih_plug/standalone-production", "dep:plugin-kit-standalone", "dep:resvg"]

[[bin]]
name = "ca72-standalone"
path = "src/bin/standalone.rs"
required-features = ["standalone-production"]

[[example]]
name = "standalone"
required-features = ["standalone"]

# On the main thread, which softbuffer's macOS backend requires: the harness runs none there.
[[test]]
name = "softbuffer_copies"
harness = false

[dependencies]
ca72.workspace = true
# The audio engine, apart from any plug-in format; the `nih-plug` feature gives the curve its
# `PersistentField` (the `#[persist]` field in `params.rs`).
ca72-engine = { workspace = true, features = ["nih-plug"] }
# The workers' real-time scheduling (decisions.md R11).
ca72-rt.workspace = true
libm.workspace = true
ca72-panel = { path = "../ca72-panel" }
nih_plug.workspace = true
plugin-kit-queue = { git = "https://github.com/idlefoundry/plugin-kit", rev = "f7aaa2b01655db5ec7432bd7b71733b8553aa5dd" }
plugin-kit-standalone = { git = "https://github.com/idlefoundry/plugin-kit", rev = "f7aaa2b01655db5ec7432bd7b71733b8553aa5dd", optional = true }
resvg = { version = "0.45", default-features = false, features = ["text"], optional = true }
# The editor's window and its pixels: baseview at the revision nih-plug's own examples use,
# and softbuffer 0.4.8, both patched (third_party/baseview/PATCHES.md,
# third_party/softbuffer/PATCHES.md). baseview takes `raw-window-handle` 0.5, softbuffer 0.6.
baseview = { path = "../../third_party/baseview" }
softbuffer = { path = "../../third_party/softbuffer", default-features = false, features = ["kms", "x11"] }
raw-window-handle = "0.5"
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6" }
keyboard-types = { version = "0.6.1", default-features = false }
# The presets' files (decisions.md R10: the format the DAW's instrument shares).
toml = "0.7"
# GitHub's answer to the update check (decisions.md R27): nih-plug's own, without the
# workspace's features. The MIDI assignments in the plug-in's state (R34) as well, with serde
# (nih-plug's too).
serde_json = "1"
serde.workspace = true
# The stereo and AUTO GAIN's machinery (plugin-kit's K6 and K7), from github.com/idlefoundry/plugin-kit
# at one commit (its main, K5 to K7 merged), as the panel takes K5.
plugin-kit-stereo = { git = "https://github.com/idlefoundry/plugin-kit", rev = "4c0f0f31041cb28b9dc803996dd01d8f44af5ce8" }

# The screen's size, for the editor's first size (and on Windows the keyboard's focus and
# the pointer's capture, and the shell that opens a release in the browser): the versions
# baseview takes.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24.0"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef", "shellapi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }
# The monitor the editor opens on (RandR): the version baseview takes, in Rust (no libXrandr).
x11rb = { version = "0.13.0", features = ["randr"] }

[dev-dependencies]
ca72-analysis.workspace = true
ca72-rt.workspace = true
tempfile.workspace = true
# The tests' view of the shared budget and the helper's rounds: this crate's unit tests are
# compiled apart from the engine's, so `cfg(test)` there is false and the feature stands in.
ca72-engine = { workspace = true, features = ["test-helpers"] }
# A CLAP host in the tests (`tests/clap_host.rs`, decisions.md R34): the bindings nih-plug's CLAP
# wrapper takes, at its revision.
clap-sys = { git = "https://github.com/micahrj/clap-sys.git", rev = "25d7f53fdb6363ad63fbd80049cb7a42a97ac156" }

# The Objective-C classes of other copies of softbuffer, and the test's own view
# (tests/softbuffer_copies.rs): the versions softbuffer takes.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGeometry"] }

# The editor's pixels read and its window captured, in the tests in a real window.
[target.'cfg(target_os = "windows")'.dev-dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef", "wingdi"] }

[lints]
workspace = true
